<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA & CGPA Calculator</title>
 
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS / Safari Standalone Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GPA Calc">
  <link rel="apple-touch-icon" href="gpa.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>
   <section id="calculator" class="tab-content">
   <h2>GP & CGPA Calculator</h2>
   <div class="card">
     <h3>Calculate Current Semester GP</h3>
     <p>Add your course units and target/received grades below:</p>
    
     <div id="course-rows">
       <div class="calculator-row">
         <input type="text" placeholder="Course Name (Optional)" class="calc-input">
         <input type="number" placeholder="Units (e.g. 3)" class="calc-unit" min="1" max="6">
         <select class="calc-grade">
           <option value="5">A (5 Points)</option>
           <option value="4">B (4 Points)</option>
           <option value="3">C (3 Points)</option>
           <option value="2">D (2 Points)</option>
           <option value="1">E (1 Point)</option>
           <option value="0">F (0 Points)</option>
         </select>
       </div>
     </div>
     
     <div class="action-buttons">
       <button class="btn btn-secondary" onclick="addCalculatorRow()"><i class="fa-solid fa-plus"></i> Add Course</button>
       <button class="btn btn-primary" onclick="calculateGP()"><i class="fa-solid fa-calculator"></i> Calculate GP</button>
     </div>
     
     <div class="result-box" id="gp-result" style="display:none;">
       <h4>Calculated GP: <span id="gp-value">0.00</span></h4>
     </div>
     
     <hr style="margin: 20px 0;">
     
     <h3>Overall CGPA Calculator</h3>
     <div class="cgpa-inputs">
       <div class="input-group">
         <label>Previous Total Units Passed</label>
         <input type="number" id="prev-units" placeholder="e.g. 60">
       </div>
       <div class="input-group">
         <label>Previous CGPA</label>
         <input type="number" step="0.01" id="prev-cgpa" placeholder="e.g. 3.75">
       </div>
     </div>
     <button class="btn btn-primary" onclick="calculateCGPA()"><i class="fa-solid fa-chart-line"></i> Calculate Overall CGPA</button>
     
     <div class="result-box" id="cgpa-result" style="display:none;">
       <h4>Cumulative CGPA: <span id="cgpa-value">0.00</span></h4>
     </div>
   </div>
 </section><br>
 
 <script src="script.js"></script>
</body>

<footer>

</footer>

</html>
